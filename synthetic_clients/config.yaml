# Конфигурация генератора синтетической панели клиентов банка.
# Версия: этап 2 (11.11.2026) — на согласование.
#
# Как читать:
#   targets    — целевые распределения (из sources.md); по ним считаются веса (raking).
#   cond       — условные зависимости. Записаны как множители к базовой вероятности:
#                1.0 = как в среднем, 2.0 = вдвое чаще, 0 = запрещено.
#                После умножения вероятности нормируются. Итоговые доли по базе
#                подгоняются к targets весами, поэтому множители задают только
#                ФОРМУ связи («у 75+ реже, чем у 35–44»), а не итоговый уровень.
#   basis      — основание: S = источник, P = прокси, A = допущение (код Д..), E = будет экспертная оценка.
#   Все числа — доли от 0 до 1, если не сказано иное.

meta:
  seed: 20261111
  n_total: 15000
  n_pilot: 500
  n_personas: 300
  n_personas_pilot: 10
  min_cell: 150            # подгруппа меньше 150 записей добирается оверсэмплингом
  oversample_cells: [age_group, settlement]   # 7 × 5 = 35 ячеек
  raking_max_iter: 200
  raking_tol: 0.0001
  tolerance_pp: {pilot: 3.0, full: 1.5}

# ───────────────────────── A. ДЕМОГРАФИЯ (население 18+) ─────────────────────────
targets_population:
  sex_age:            # basis: S [2] ООН WPP 2024
    M:  {"18-24": 0.047, "25-34": 0.073, "35-44": 0.105, "45-54": 0.082, "55-64": 0.069, "65-74": 0.052, "75+": 0.022}
    F:  {"18-24": 0.045, "25-34": 0.072, "35-44": 0.107, "45-54": 0.092, "55-64": 0.088, "65-74": 0.087, "75+": 0.058}
  federal_district:   # basis: S [1] Росстат в справке ЦБ, 18+, 01.01.2025
    ЦФО: 0.283
    ПФО: 0.195
    ЮФО: 0.114
    СФО: 0.110
    СЗФО: 0.098
    УФО: 0.082
    СКФО: 0.066
    ДВФО: 0.052
  settlement:         # basis: S [3] слайд 6
    Москва: 0.09
    Санкт-Петербург: 0.04
    "Город 500 тыс.+": 0.20
    "Город до 500 тыс.": 0.42
    Село: 0.25
  education:          # basis: S [3] слайд 8
    "Среднее общее и ниже": 0.39
    "Среднее специальное": 0.36
    "Высшее": 0.25
  employment:         # basis: S [4][6], остаток — A Д2
    Работает: 0.643            # включая работающих пенсионеров (0.062)
    "Неработающий пенсионер": 0.287
    Безработный: 0.015
    Студент: 0.025
    "Домохозяйство / уход за детьми": 0.020
    Прочее: 0.010
  income_quintile:    # basis: S [3] слайд 10; подушевой доход домохозяйства, руб./мес., цены 2024
    Q1: 0.20   # до 18,5 тыс.
    Q2: 0.20   # 18,5–24,5 тыс.
    Q3: 0.20   # 24,5–32 тыс.
    Q4: 0.20   # 32–45 тыс.
    Q5: 0.20   # 45 тыс. и выше
  income_labels:
    Q1: "до 18,5 тыс."
    Q2: "18,5–24,5 тыс."
    Q3: "24,5–32 тыс."
    Q4: "32–45 тыс."
    Q5: "45 тыс. и выше"

# ─────────────── Переход «население → клиенты»  (шаг 1) ───────────────
transition:
  banked_share: 0.908          # basis: S [1]
  unbanked_multipliers:        # basis: A Д1 — во сколько раз чаще «вне банков»
    age: {"18-24": 1.2, "25-34": 0.8, "35-44": 0.7, "45-54": 0.8, "55-64": 0.9, "65-74": 1.2, "75+": 2.0}
    settlement: {Москва: 0.6, Санкт-Петербург: 0.6, "Город 500 тыс.+": 0.8, "Город до 500 тыс.": 1.0, Село: 2.0}
    income_quintile: {Q1: 2.0, Q2: 1.2, Q3: 0.9, Q4: 0.6, Q5: 0.4}
  # Цели для клиентов = цели для населения, пересчитанные с учётом этих множителей
  # (делает генератор; таблица пересчёта попадёт в validation_report.md).

